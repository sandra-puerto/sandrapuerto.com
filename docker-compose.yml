# ============================================================================
# LANDING-SGPT — static content delivery
# Stratum consumer pattern.
# ============================================================================
#
# Component ......... landing-sgpt
# Function .......... Static content delivery behind Nginx Proxy Manager.
# Pattern ........... Stratum consumer
# Artifact .......... docker-compose.yml
# Revision .......... 1.0.2
# Status ............ Production
#
# ----------------------------------------------------------------------------
# 1. OVERVIEW
# ----------------------------------------------------------------------------
# This project serves a static site. It follows the Stratum consumer
# pattern:
#
#   - It does not provision networks.
#   - It consumes stratum_dmz as an external network.
#   - Its containers are named after the project, not after Stratum.
#   - It references the platform only through the shared network.
#
# ----------------------------------------------------------------------------
# 2. NETWORK TOPOLOGY
# ----------------------------------------------------------------------------
#   stratum_dmz (external)
#     Shared Demilitarized Zone. Provisioned by stratum/dmz.
#     Consumed here to receive inbound traffic from NPM.
#
# ----------------------------------------------------------------------------
# 3. DEPLOYMENT ORDER
# ----------------------------------------------------------------------------
#   1. stratum/dmz/         -> provisions stratum_dmz
#   2. stratum/gateway/     -> NPM operational
#   3. landing-sgpt/ (this) -> consumes stratum_dmz
#
# After deployment, configure a Proxy Host in the NPM panel:
#   Forward Hostname ... landing-sgpt-web
#   Forward Port ....... 80
#   Scheme ............. http
# ============================================================================

x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

name: landing-sgpt

services:

  web:
    <<: *defaults
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: landing-sgpt-web
    init: true

    environment:
      TZ: ${TZ:-America/Bogota}

    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - stratum_dmz

    read_only: true

    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    pids_limit: 100
    mem_limit: 128m
    memswap_limit: 128m

    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    stop_signal: SIGTERM
    stop_grace_period: 10s

    labels:
      com.sandrapuerto.project: "landing-sgpt"
      com.sandrapuerto.pattern: "stratum-consumer"
      com.sandrapuerto.role: "static-server"
      com.sandrapuerto.revision: "1.0.2"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  stratum_dmz:
    name: ${STRATUM_DMZ_NETWORK:-stratum_dmz}
    external: true