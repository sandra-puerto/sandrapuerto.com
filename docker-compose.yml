# ============================================================================
# LANDING-SGPT — static content delivery
# Stratum sovereign consumer pattern (v2.0)
# ============================================================================
#
# Component ......... landing-sgpt
# Function .......... Static content delivery behind Stratum Gateway / NPM.
# Pattern ........... Stratum Sovereign Consumer (Tier 3 / Perimeter Consumer)
# Artifact .......... docker-compose.yml
# Revision .......... 2.0.0
# Status ............ Production
#
# ----------------------------------------------------------------------------
# 1. ARCHITECTURAL OVERVIEW
# ----------------------------------------------------------------------------
# This project serves the personal and portfolio site sandrapuerto.com.
# It implements the Stratum Sovereign Consumer pattern:
#
#   - It does not provision platform networks.
#   - It attaches to an external Stratum network:
#       * Perimeter DMZ (default): `stratum_dmz`
#       * Organization Island (Tier 3): `stratum_${TENANT_ORG}_internal`
#   - Exposes zero host ports (0.0.0.0 unbound).
#   - Operates with an immutable, read-only root filesystem and dropped capabilities.
#   - Exposes dual network aliases:
#       * `landing-sgpt-web` (legacy gateway compatibility)
#       * `stratum-app-${TENANT_ORG:-sgpt}-web` (Stratum CLI route standard)
#
# ----------------------------------------------------------------------------
# 2. STRATUM CLI INGRESS ROUTING
# ----------------------------------------------------------------------------
# To expose this service through a Stratum Organization Boundary Router:
#
#   stratum route add sgpt web stratum-app-sgpt-web:80 --domain sandrapuerto.com
#
# ============================================================================

x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

name: landing-sgpt

services:

  web:
    <<: *defaults
    image: ${NGINX_IMAGE:-nginx:latest}
    container_name: stratum-app-${TENANT_ORG:-sgpt}-web
    init: true

    environment:
      TZ: ${TZ:-America/Bogota}

    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./templates:/usr/share/nginx/templates:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      stratum_network:
        aliases:
          - landing-sgpt-web
          - stratum-app-${TENANT_ORG:-sgpt}-web
          - web

    read_only: true

    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755,nosuid,nodev,noexec
      - /var/run:size=8m,mode=0755,nosuid,nodev,noexec
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    pids_limit: 100
    mem_limit: 128m
    memswap_limit: 128m

    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    stop_signal: SIGTERM
    stop_grace_period: 10s

    labels:
      org.opencontainers.image.authors: "Sandra Gabriela Puerto Torres <contacto@sandrapuerto.com>"
      org.opencontainers.image.vendor: "Isora Cloud Group"
      com.isora.website: "https://sandrapuerto.com"
      com.isora.security: "security@isora.com.co"
      com.stratum-core.component: "consumer-workload"
      com.stratum-core.organization: "${TENANT_ORG:-sgpt}"
      com.stratum-core.revision: "2.0.0"
      com.stratum-core.slogan: "Isolation by design, not by discipline."
      com.sandrapuerto.project: "landing-sgpt"
      com.sandrapuerto.role: "static-server"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  stratum_network:
    name: ${STRATUM_NETWORK:-${STRATUM_DMZ_NETWORK:-stratum_dmz}}
    external: true