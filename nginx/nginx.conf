# ============================================================================
# LANDING-SGPT — (nginx.conf)
# Stratum Consumer Pattern
# ============================================================================
#
# Component ......... landing-sgpt
# Function .......... Main Nginx configuration (Worker processes, Events, HTTP core).
# Notes ............. Runs as read_only in the container.
# ============================================================================

user  nginx;
worker_processes  auto;

# Logs a stdout/stderr: el contenedor es read_only, y así Docker los captura.
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /dev/stdout  main;

    # ------------------------------------------------------------------------
    # Real IP (detrás de NPM): restaura la IP del cliente
    # ------------------------------------------------------------------------
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------------------
    # Core performance
    # ------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;
    port_in_redirect   off;
    absolute_redirect  off;

    # ------------------------------------------------------------------------
    # Timeouts y límites de request
    # ------------------------------------------------------------------------
    client_body_timeout       12s;
    client_header_timeout     12s;
    send_timeout              10s;
    reset_timedout_connection on;
    client_max_body_size      1m;
    client_body_buffer_size   128k;
    large_client_header_buffers 4 8k;

    # ------------------------------------------------------------------------
    # Compresión gzip (nginx stock no trae brotli)
    # ------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xhtml+xml
        application/xml
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml;

    # Si en build generas .gz precomprimidos, descomenta:
    # gzip_static on;

    # ------------------------------------------------------------------------
    # File cache (kernel-level)
    # ------------------------------------------------------------------------
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ------------------------------------------------------------------------
    # Rate limiting (protege contra floods básicos; NPM/Cloudflare añaden más)
    # ------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ------------------------------------------------------------------------
    # Server blocks
    # ------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}