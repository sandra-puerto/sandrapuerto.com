# ============================================================================
# LANDING-SGPT — (default.conf)
# Stratum Consumer Pattern
# ============================================================================
#
# Component ......... landing-sgpt
# Function .......... Nginx server block configuration for the static site.
# ============================================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # ------------------------------------------------------------------------
    # Security: Limit HTTP Methods
    # ------------------------------------------------------------------------
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Rate limiting a nivel de server (zonas ya definidas en nginx.conf)
    # limit_req  usa zone=<nombre>; limit_conn usa el nombre desnudo (sin zone=).
    limit_req  zone=perip burst=40 nodelay;
    limit_conn addr 20;

    # ------------------------------------------------------------------------
    # Healthcheck
    # ------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        # default_type (no add_header) evita el Content-Type duplicado que
        # produce add_header con el cuerpo devuelto por return.
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------------
    # Headers de seguridad (aplican a todo el sitio)
    # ------------------------------------------------------------------------
    # OJO: nginx NO hereda los add_header del nivel server cuando el location
    # declara sus propios add_header (p.ej. Cache-Control). Por eso cada bloque
    # que fija Cache-Control repite estas cuatro cabeceras explícitamente.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    # HSTS: solo si NPM ya termina TLS y fuerza HTTPS en todo el dominio.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------------------
    # Static Assets (/css, /js, /icons, /images)
    # ------------------------------------------------------------------------
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
    }

    # ------------------------------------------------------------------------
    # Favicon / manifest: cache moderado, sin log de ruido
    # ------------------------------------------------------------------------
    location = /favicon.ico {
        try_files /icons/favicon.ico $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
        log_not_found off;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        default_type application/manifest+json;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    }

    # ------------------------------------------------------------------------
    # HTML: no cachear agresivo (para que las mejoras de SEO se reflejen rápido)
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}