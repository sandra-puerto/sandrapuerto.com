# ============================================================================
# LANDING-SGPT — (default.conf)
# Stratum Consumer Pattern
# ============================================================================
#
# Component ......... landing-sgpt
# Function .......... Nginx server block configuration for the static site.
# Architecture ...... Out-of-tree system templates, clean URLs & hardened perimeter.
# ============================================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # ------------------------------------------------------------------------
    # Security: Limit HTTP Methods
    # ------------------------------------------------------------------------
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;
    autoindex   off;

    # Rate limiting a nivel de server (zonas definidas en nginx.conf)
    limit_req   zone=perip burst=40 nodelay;
    limit_conn  addr 20;

    # ------------------------------------------------------------------------
    # Healthcheck (Docker / NPM)
    # ------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------------
    # Canonicidad de URLs (SEO Normalization)
    # ------------------------------------------------------------------------
    # Normalizar index.html a su ruta limpia canónica
    if ($request_uri ~* "^(.*/)index\.html(?:$|\?)") {
        return 301 $1;
    }

    # ------------------------------------------------------------------------
    # Headers de seguridad base
    # ------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;

    # ------------------------------------------------------------------------
    # Hardening: Bloqueo de Archivos Ocultos y Extensiones Sensibles
    # ------------------------------------------------------------------------
    # Denegar archivos o carpetas que comiencen con punto (.git, .env, etc.)
    # exceptuando estrictamente /.well-known/ para estándares web
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Denegar extensiones de desarrollo, backups o configuraciones
    location ~* \.(?:bak|conf|config|sql|ini|log|sh|bash|ps1|py|swp|dist|yaml|yml|orig|save|env|git|md)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ------------------------------------------------------------------------
    # Favicons & Touch Icons (Mapeo limpio a raíz con fallback a /icons/)
    # ------------------------------------------------------------------------
    location = /favicon.ico {
        try_files $uri /icons/favicon.ico =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
        log_not_found off;
    }

    location ~* ^/apple-touch-icon(?:-precomposed)?\.png$ {
        try_files $uri /icons/apple-touch-icon.png =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------------
    # Documentos Dinámicos / PDF (Curriculum Vitae)
    # ------------------------------------------------------------------------
    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
    }

    # ------------------------------------------------------------------------
    # Static Assets Inmutables (/css, /js, /icons, /images)
    # ------------------------------------------------------------------------
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
    }

    # ------------------------------------------------------------------------
    # Manifest / PWA
    # ------------------------------------------------------------------------
    location ~* ^/(?:manifest\.json|site\.webmanifest)$ {
        try_files $uri /manifest.json =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        default_type application/manifest+json;
    }

    # ------------------------------------------------------------------------
    # Archivos de Texto Legítimos (Robots, Humans, LLMs, Sitemap)
    # ------------------------------------------------------------------------
    location ~* ^/(?:humans|llms|robots)\.txt$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    }

    # ------------------------------------------------------------------------
    # Well-Known (security.txt, etc.)
    # ------------------------------------------------------------------------
    location ^~ /.well-known/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------------
    # HTML Delivery (Landing, Blog & Subpáginas)
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    }

    # ------------------------------------------------------------------------
    # Error Handlers (Plantillas de Sistema Aisladas en /usr/share/nginx/templates)
    # ------------------------------------------------------------------------
    # 404 Not Found: Servido estrictamente desde el directorio interno montado
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/templates;
        try_files /404.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;
    }
}